<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- These lines make it look like a real app when added to the iPhone home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Service Menu">
    <meta name="theme-color" content="#f7c6d6">
    <title>Service Menu</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Arial, sans-serif;
            max-width: 460px;
            margin: 0 auto;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            background: #fff5f8;
            color: #333;
        }
        h1 { text-align: center; margin: 8px 0 16px; }
        h2 { margin: 20px 0 8px; font-size: 18px; }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        button {
            font-size: 16px;
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
        }
        button:active { transform: scale(0.96); }

        /* Service buttons */
        #services {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        #services button { background: lightpink; padding: 16px 0; }

        /* Order list */
        #order-list { list-style: none; padding: 0; margin: 0; }
        #order-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
        }
        #order-list li button { background: #eee; padding: 4px 10px; }
        .empty { color: #999; }

        #totals {
            background: white;
            border-radius: 10px;
            padding: 12px;
            line-height: 1.6;
        }
        #totals .final { font-weight: bold; font-size: 18px; }

        /* Action buttons */
        .row { display: flex; gap: 8px; margin-top: 12px; }
        .row button { flex: 1; }
        .clear { background: #eee; }
        .finish { background: lightgreen; font-weight: bold; }
        .history { background: #dbe9ff; }
        .today { background: gold; }
        .edit { background: #e8e0ff; }

        /* Pop-up panels (history and edit prices) */
        .panel {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            overflow-y: auto;
        }
        .panel.open { display: block; }
        .panel-box {
            background: white;
            max-width: 430px;
            margin: 40px auto;
            border-radius: 14px;
            padding: 16px;
        }
        .history-item {
            border-bottom: 1px solid #eee;
            padding: 8px 0;
            font-size: 14px;
        }
        .price-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .price-row label { flex: 1; }
        .price-row input { width: 100px; }
    </style>
</head>
<body>
    <h1>Choose your services</h1>

    <input id="name" placeholder="Customer name">

    <div id="services"></div>

    <h2>Your order:</h2>
    <ul id="order-list"></ul>
    <div id="totals"></div>

    <div class="row">
        <button class="clear" onclick="clearOrder()">Clear</button>
        <button class="finish" onclick="finishOrder()">Finish order</button>
    </div>
    <div class="row">
        <button class="history" onclick="showHistory()">Order history</button>
        <button class="today" onclick="showTodayTotal()">Today's earnings</button>
    </div>
    <div class="row">
        <button class="edit" onclick="openEditPrices()">Edit prices</button>
    </div>

    <!-- Order history pop-up -->
    <div class="panel" id="history-panel">
        <div class="panel-box">
            <h2>Order history</h2>
            <div id="history-list"></div>
            <div class="row">
                <button class="clear" onclick="closePanel('history-panel')">Close</button>
            </div>
        </div>
    </div>

    <!-- Edit prices pop-up -->
    <div class="panel" id="prices-panel">
        <div class="panel-box">
            <h2>Edit prices</h2>
            <div id="price-inputs"></div>
            <div class="row">
                <button class="clear" onclick="closePanel('prices-panel')">Cancel</button>
                <button class="finish" onclick="savePrices()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- STEP 1: Settings and data ----------
        const CURRENCY = "€";
        const DEFAULT_PRICES = {
            "classic": 40,
            "2d": 45,
            "3d": 45,
            "4d": 50,
            "removal": 10,
        };
        let order = [];

        // localStorage = the phone's memory for this page (like orders.txt and prices.json)
        function loadData(key, fallback) {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : fallback;
            } catch {
                return fallback;
            }
        }

        function saveData(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch {
                alert("Could not save. Is private browsing turned on?");
            }
        }

        let prices = loadData("prices", { ...DEFAULT_PRICES });

        function money(amount) {
            return `${CURRENCY}${amount.toFixed(2)}`;
        }

        function getDiscount(totalPrice) {
            if (totalPrice >= 100) {
                return totalPrice * 0.10;
            }
            return 0;
        }

        function orderTotal() {
            let total = 0;
            for (const s of order) {
                total += prices[s];
            }
            return total;
        }

        // ---------- STEP 2: Button actions ----------
        function addService(service) {
            order.push(service);
            updateDisplay();
        }

        function removeService(index) {
            order.splice(index, 1);
            updateDisplay();
        }

        function clearOrder() {
            order = [];
            updateDisplay();
        }

        function finishOrder() {
            const nameBox = document.getElementById("name");
            const name = nameBox.value.trim();
            if (!name) {
                alert("Please enter the customer's name.");
                return;
            }
            if (order.length === 0) {
                alert("Please choose at least one service.");
                return;
            }
            const total = orderTotal();
            const discount = getDiscount(total);
            const summary = order.map(s => `${s}: ${CURRENCY}${prices[s]}`).join("\n");
            alert(
                `Order for ${name}\n\n${summary}\n\n` +
                `Total: ${money(total)}\nDiscount: ${money(discount)}\nFinal Price: ${money(total - discount)}`
            );

            // Save the order (like save_order in Python)
            const history = loadData("orders", []);
            history.push({
                date: new Date().toISOString(),
                name: name,
                services: [...order],
                final: total - discount,
            });
            saveData("orders", history);

            clearOrder();
            nameBox.value = "";
        }

        function showHistory() {
            const history = loadData("orders", []);
            const box = document.getElementById("history-list");
            box.innerHTML = "";
            if (history.length === 0) {
                box.innerHTML = '<p class="empty">No orders yet.</p>';
            }
            // Newest first
            for (const o of [...history].reverse()) {
                const when = new Date(o.date).toLocaleString();
                const div = document.createElement("div");
                div.className = "history-item";
                div.textContent = `${when} | ${o.name} | ${o.services.join(", ")} | Final: ${money(o.final)}`;
                box.appendChild(div);
            }
            document.getElementById("history-panel").classList.add("open");
        }

        function showTodayTotal() {
            const history = loadData("orders", []);
            const today = new Date().toDateString();
            let totalToday = 0;
            let count = 0;
            for (const o of history) {
                if (new Date(o.date).toDateString() === today) {
                    totalToday += o.final;
                    count += 1;
                }
            }
            alert(`Orders today: ${count}\nEarned today: ${money(totalToday)}`);
        }

        function openEditPrices() {
            const box = document.getElementById("price-inputs");
            box.innerHTML = "";
            for (const service in prices) {
                const row = document.createElement("div");
                row.className = "price-row";
                row.innerHTML = `
                    <label>${service}</label>
                    <input type="number" min="0" step="0.5" inputmode="decimal"
                           data-service="${service}" value="${prices[service]}">`;
                box.appendChild(row);
            }
            document.getElementById("prices-panel").classList.add("open");
        }

        function savePrices() {
            const inputs = document.querySelectorAll("#price-inputs input");
            const newPrices = {};
            for (const input of inputs) {
                const value = parseFloat(input.value);
                if (isNaN(value) || value < 0) {
                    alert(`Please enter a valid price for ${input.dataset.service}.`);
                    return;
                }
                newPrices[input.dataset.service] = value;
            }
            prices = newPrices;
            saveData("prices", prices);
            buildServiceButtons();
            updateDisplay();
            closePanel("prices-panel");
        }

        function closePanel(id) {
            document.getElementById(id).classList.remove("open");
        }

        // ---------- STEP 3: Refresh the list and totals ----------
        function updateDisplay() {
            const list = document.getElementById("order-list");
            list.innerHTML = "";
            if (order.length === 0) {
                list.innerHTML = '<li class="empty">Nothing chosen yet</li>';
            }
            order.forEach((s, index) => {
                const item = document.createElement("li");
                item.innerHTML = `<span>${s}: ${CURRENCY}${prices[s]}</span>`;
                const removeButton = document.createElement("button");
                removeButton.textContent = "✕";
                removeButton.onclick = () => removeService(index);
                item.appendChild(removeButton);
                list.appendChild(item);
            });

            const total = orderTotal();
            const discount = getDiscount(total);
            document.getElementById("totals").innerHTML =
                `Total: ${money(total)}<br>` +
                `Discount: ${money(discount)}<br>` +
                `<span class="final">Final: ${money(total - discount)}</span>`;
        }

        // ---------- STEP 4: One button per service ----------
        function buildServiceButtons() {
            const servicesBox = document.getElementById("services");
            servicesBox.innerHTML = "";
            for (const service in prices) {
                const button = document.createElement("button");
                button.innerHTML = `${service}<br>${CURRENCY}${prices[service]}`;
                button.onclick = () => addService(service);
                servicesBox.appendChild(button);
            }
        }

        buildServiceButtons();
        updateDisplay();
    </script>
</body>
</html>
